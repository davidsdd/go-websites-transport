<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 在线访问首页文件名时统一跳转到目录地址；本地双击打开不跳转。 -->
  <script>
    (() => {
      const url = new URL(window.location.href);
      if ((url.protocol === "http:" || url.protocol === "https:") && /\/index(?:\.html)?$/.test(url.pathname)) {
        url.pathname = url.pathname.replace(/index(?:\.html)?$/, "");
        window.location.replace(url.href);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#edf2f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101a23" media="(prefers-color-scheme: dark)">
  <!-- 修改这里可以更改浏览器标签页上的标题。 -->
  <title>Transport Service</title>
  <!-- 提前读取本地字体；无需联网。 -->
  <link rel="preload" href="./fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/shield.svg" as="image">
  <!-- 首屏背景直接适配主题，样式加载期间也保持相同底色。 -->
  <style>
    html { color-scheme: light dark; background: #edf2f5; }
    @media (prefers-color-scheme: dark) { html { background: #101a23; } }
    html.startup-pending .page > * { opacity: 0 !important; }
    html.startup-fallback {
      --font-cormorant: Georgia, serif;
      --font-dm-sans: Arial, sans-serif;
      --font-grotesk: Arial, sans-serif;
      --font-mono: monospace;
    }
  </style>
  <!-- 字体和本地图标准备好后一起显示，避免默认字体切换及图标迟到。 -->
  <script>
    (() => {
      if (!document.fonts) return;
      const root = document.documentElement;
      root.classList.add("startup-pending");
      const reveal = () => root.classList.remove("startup-pending");
      // 文件缺失或加载异常时仍能显示内容，不会一直隐藏页面。
      const limit = setTimeout(() => {
        // 超时后保持回退字体，避免迟到的字体再次改变已显示的排版。
        root.classList.add("startup-fallback");
        reveal();
      }, 3000);
      window.addEventListener("DOMContentLoaded", () => {
        const fonts = Array.from(document.fonts, font => font.load());
        const images = Array.from(document.images, image =>
          typeof image.decode === "function" ? image.decode() : Promise.resolve()
        );
        Promise.allSettled([...fonts, ...images])
          .then(() => document.fonts.ready)
          .then(() => { clearTimeout(limit); reveal(); }, reveal);
      }, { once: true });
    })();
  </script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./assets/shield.svg" type="image/svg+xml">
</head>
<body>
  <main class="page">
    <div class="hero">
      <div class="brand">
        <!-- 盾牌内的道路图形代表运输与安保；图像和字体均保存在本地。 -->
        <img class="shield" src="./assets/shield.svg" alt="" aria-hidden="true" width="120" height="144">

        <!-- 页面标题：直接修改下面这行文字即可。 -->
        <h1>Transport Service</h1>

        <div class="brand-divider" aria-hidden="true"></div>
      </div>
    </div>
  </main>
</body>
</html>
